# Server Configuration
server.port=8080

# Application
spring.application.name=critical-infrastructure-sensor-simulator

# Critical Infrastructure Simulation Settings
simulation.interval=1000
simulation.default-mode=NORMAL
simulation.enabled=true
simulation.websocket-enabled=true

# PEKKA AI Backend Integration
pekka.backend.url=http://127.0.0.1:8001
pekka.backend.ingestion-endpoint=/api/v1/readings
pekka.backend.enabled=true
simulation.pekka-backend-url=${pekka.backend.url}
simulation.pekka-ingestion-endpoint=${pekka.backend.ingestion-endpoint}
simulation.pekka-ingestion-enabled=${pekka.backend.enabled}

# Logging
logging.level.com.critical.infra=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
